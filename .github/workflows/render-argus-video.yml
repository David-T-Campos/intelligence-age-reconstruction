name: Render ARGUS Engineer video

on:
  push:
    branches: [main]
    paths:
      - "src/argus_brand.py"
      - "scripts/render_argus_direct.py"
      - "scripts/patch_argus_outro.py"
      - "tests/test_argus_brand.py"
      - ".github/workflows/render-argus-video.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-lato
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "yt-dlp[default,curl-cffi]"
          ffmpeg -version | head -n 1

      - name: Run ARGUS transform tests
        run: python -m unittest discover -s tests -p "test_argus_brand.py"

      - name: Download best public reference and prepare 1080p working master
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reference/download
          hls="https://player.vimeo.com/external/1128117661.m3u8?s=800251362650a93a1103fae9b5d121fb8750e170&logging=false"

          ffmpeg -hide_banner -loglevel warning -y \
            -user_agent "Mozilla/5.0" -i "$hls" \
            -map 0:v:0 -map 0:a:0? -c copy \
            reference/download/public-master.mp4

          width="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 reference/download/public-master.mp4)"
          height="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 reference/download/public-master.mp4)"
          fps="$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate -of csv=p=0 reference/download/public-master.mp4)"
          duration="$(ffprobe -v error -show_entries format=duration -of csv=p=0 reference/download/public-master.mp4)"
          echo "Public master: ${width}x${height}, fps=${fps}, duration=${duration}"

          python - "$width" "$height" "$fps" "$duration" <<'PY'
          import sys
          w, h = int(sys.argv[1]), int(sys.argv[2])
          num, den = map(float, sys.argv[3].split('/'))
          fps = num / den
          duration = float(sys.argv[4])
          if (w, h) not in {(1280, 720), (1920, 1080)}:
              raise SystemExit(f"Unexpected public master size: {w}x{h}")
          if not (23.90 <= fps <= 24.10):
              raise SystemExit(f"Unexpected fps: {fps}")
          if not (59.0 <= duration <= 61.5):
              raise SystemExit(f"Unexpected duration: {duration}")
          PY

          if [ "$width" = "1920" ] && [ "$height" = "1080" ]; then
            cp reference/download/public-master.mp4 reference/original-60s.mp4
          else
            echo "Public CDN tops out at 720p; preparing a visually lossless Lanczos 1080p working master."
            ffmpeg -hide_banner -loglevel warning -y \
              -i reference/download/public-master.mp4 \
              -map 0:v:0 -map 0:a:0? \
              -vf "scale=1920:1080:flags=lanczos" \
              -c:v libx264 -preset medium -crf 0 -pix_fmt yuv420p \
              -c:a copy -movflags +faststart \
              reference/original-60s.mp4
          fi

          ffprobe -hide_banner reference/original-60s.mp4

      - name: Apply final ARGUS outro treatment
        run: |
          python scripts/patch_argus_outro.py
          python -m unittest discover -s tests -p "test_argus_brand.py"

      - name: Render and validate every frame
        run: python scripts/render_argus_direct.py

      - name: Verify Apple-compatible delivery codec
        run: |
          python - <<'PY'
          import json
          import subprocess

          path = "renders/argus-engineer-intelligence-age.mp4"
          raw = subprocess.check_output([
              "ffprobe", "-v", "error", "-select_streams", "v:0",
              "-show_entries", "stream=codec_name,profile,pix_fmt,level,width,height,r_frame_rate",
              "-of", "json", path,
          ])
          stream = json.loads(raw)["streams"][0]
          print(json.dumps(stream, indent=2))
          assert stream["codec_name"] == "h264"
          assert stream["profile"] == "High"
          assert stream["pix_fmt"] == "yuv420p"
          assert stream["level"] == 41
          assert stream["width"] == 1920 and stream["height"] == 1080
          assert stream["r_frame_rate"] == "24/1"
          PY

      - name: Verify final dots stay circular
        run: |
          python - <<'PY'
          import cv2
          import numpy as np

          path = "renders/argus-engineer-intelligence-age.mp4"
          cap = cv2.VideoCapture(path)
          count = round(cap.get(cv2.CAP_PROP_FRAME_COUNT))
          cap.set(cv2.CAP_PROP_POS_FRAMES, count - 1)
          ok, frame = cap.read()
          cap.release()
          assert ok

          hsv = cv2.cvtColor(frame, cv2.COLOR_BGR2HSV)
          h, s, v = cv2.split(hsv)
          mask = (((h >= 100) & (h <= 125) & (s >= 100) & (v >= 120))
                  .astype(np.uint8))
          contours, _ = cv2.findContours(mask, cv2.RETR_EXTERNAL,
                                         cv2.CHAIN_APPROX_SIMPLE)
          circularities = []
          for contour in contours:
              area = cv2.contourArea(contour)
              perimeter = cv2.arcLength(contour, True)
              if 12 <= area <= 220 and perimeter > 0:
                  circularities.append(4.0 * np.pi * area / (perimeter * perimeter))
          assert len(circularities) > 100, len(circularities)
          median = float(np.median(circularities))
          p10 = float(np.percentile(circularities, 10))
          print({"round_dot_components": len(circularities),
                 "median_circularity": median, "p10_circularity": p10})
          assert median >= 0.72, median
          assert p10 >= 0.60, p10
          PY

      - name: Show QA summary
        if: always()
        run: |
          if [ -f reports/argus-direct/qa.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          q = json.loads(Path('reports/argus-direct/qa.json').read_text())
          q.pop('per_frame', None)
          print(json.dumps(q, indent=2))
          PY
          fi

      - name: Upload finished video and QA package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: argus-engineer-final-video
          path: |
            renders/argus-engineer-intelligence-age.mp4
            reports/argus-direct/qa.json
            reports/argus-direct/*contact-sheet.jpg
            reports/argus-direct/worst-frame-neighborhood.jpg
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
