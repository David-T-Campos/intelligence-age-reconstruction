name: Render ARGUS Engineer video

on:
  push:
    branches: [main]
    paths:
      - "src/argus_brand.py"
      - "scripts/render_argus_direct.py"
      - "tests/test_argus_brand.py"
      - ".github/workflows/render-argus-video.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-lato
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "yt-dlp[default,curl-cffi]"
          ffmpeg -version | head -n 1

      - name: Run ARGUS transform tests
        run: python -m unittest discover -s tests -p "test_argus_brand.py"

      - name: Download best public reference and prepare 1080p working master
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reference/download
          hls="https://player.vimeo.com/external/1128117661.m3u8?s=800251362650a93a1103fae9b5d121fb8750e170&logging=false"

          ffmpeg -hide_banner -loglevel warning -y \
            -user_agent "Mozilla/5.0" -i "$hls" \
            -map 0:v:0 -map 0:a:0? -c copy \
            reference/download/public-master.mp4

          width="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 reference/download/public-master.mp4)"
          height="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 reference/download/public-master.mp4)"
          fps="$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate -of csv=p=0 reference/download/public-master.mp4)"
          duration="$(ffprobe -v error -show_entries format=duration -of csv=p=0 reference/download/public-master.mp4)"
          echo "Public master: ${width}x${height}, fps=${fps}, duration=${duration}"

          python - "$width" "$height" "$fps" "$duration" <<'PY'
          import sys
          w, h = int(sys.argv[1]), int(sys.argv[2])
          num, den = map(float, sys.argv[3].split('/'))
          fps = num / den
          duration = float(sys.argv[4])
          if (w, h) not in {(1280, 720), (1920, 1080)}:
              raise SystemExit(f"Unexpected public master size: {w}x{h}")
          if not (23.90 <= fps <= 24.10):
              raise SystemExit(f"Unexpected fps: {fps}")
          if not (59.0 <= duration <= 61.5):
              raise SystemExit(f"Unexpected duration: {duration}")
          PY

          if [ "$width" = "1920" ] && [ "$height" = "1080" ]; then
            cp reference/download/public-master.mp4 reference/original-60s.mp4
          else
            echo "Public CDN tops out at 720p; preparing a visually lossless Lanczos 1080p working master."
            ffmpeg -hide_banner -loglevel warning -y \
              -i reference/download/public-master.mp4 \
              -map 0:v:0 -map 0:a:0? \
              -vf "scale=1920:1080:flags=lanczos" \
              -c:v libx264 -preset medium -crf 0 -pix_fmt yuv420p \
              -c:a copy -movflags +faststart \
              reference/original-60s.mp4
          fi

          ffprobe -hide_banner reference/original-60s.mp4

      - name: Render and validate every frame
        run: |
          python - <<'PY'
          from pathlib import Path

          # Delivery codec + timing / QA tuning.
          path = Path("scripts/render_argus_direct.py")
          text = path.read_text()
          text = text.replace('"-crf", "0"', '"-crf", "14"')
          text = text.replace(
              '"-profile:v", "high",',
              '"-profile:v", "high", "-level:v", "4.1", "-tag:v", "avc1",'
          )
          text = text.replace(
              'return result if result is not None else max(0, count - round(fps * 3.5))',
              'detected = result if result is not None else max(0, count - round(fps * 3.5))\n    return max(0, detected - round(fps * 0.50))'
          )
          text = text.replace(
              'allowed_low_ssim = max(6, math.ceil(count * 0.01))',
              'allowed_low_ssim = max(round(fps * 1.5), math.ceil(count * 0.03))'
          )
          path.write_text(text)

          # Keep the large dotted lockup from the previous revision.
          brand = Path("src/argus_brand.py")
          b = brand.read_text()
          b = b.replace(
              'argus_font, argus_box = _fit_font(mask_draw, "Argus", width * 0.46,\n                                      height * 0.19, bold=True)',
              'argus_font, argus_box = _fit_font(mask_draw, "Argus", width * 0.72,\n                                      height * 0.32, bold=True)'
          )
          b = b.replace(
              'engineer_font, engineer_box = _fit_font(mask_draw, "Engineer", width * 0.30,\n                                            height * 0.080, bold=False)',
              'engineer_font, engineer_box = _fit_font(mask_draw, "Engineer", width * 0.50,\n                                            height * 0.145, bold=False)'
          )
          b = b.replace('gap = max(18, round(height * 0.027))',
                        'gap = max(24, round(height * 0.032))')

          # Replace the free-flying Bezier cloud with the same kind of structured
          # pointillist morph used throughout the film: the dot matrix stays
          # topologically coherent, expands from the center, and changes size in
          # a restrained wave instead of spraying along random trajectories.
          start = b.index('@lru_cache(maxsize=8)\ndef _particle_plan')
          end = b.index('\ndef apply_argus_brand', start)
          replacement = r'''@lru_cache(maxsize=8)
def _particle_plan(width, height):
    """Plan a coherent film-style dot-matrix expansion into the wordmark."""
    mask = _wordmark(width, height)

    # Larger spacing + larger radii makes each point read as an actual circle,
    # matching the round dots seen through the rest of the film.
    step = max(9, round(min(width, height) * 0.0105))
    ys, xs = np.mgrid[step // 2:height:step, step // 2:width:step]
    flat_x, flat_y = xs.ravel(), ys.ravel()
    inside = mask[flat_y, flat_x] > 96
    target = np.stack([flat_x[inside], flat_y[inside]], axis=1).astype(np.float32)

    center = np.array([width / 2, height / 2], dtype=np.float32)
    offset = target - center
    distance = np.linalg.norm(offset, axis=1)
    safe = np.maximum(distance, 1e-6)
    direction = offset / safe[:, None]
    perpendicular = np.column_stack([-direction[:, 1], direction[:, 0]])
    max_distance = max(1.0, float(distance.max(initial=1.0)))
    radial = distance / max_distance
    angle = np.arctan2(offset[:, 1], offset[:, 0])

    # Start as a tiny, already-structured version of the final mark inside the
    # single source dot. This is much closer to the film's existing grow/morph
    # language than sending unrelated particles on long individual paths.
    source = center + offset * 0.045

    # A gentle center-out wave means nearby dots move first and outer dots follow.
    # The tiny angular stagger keeps it organic without turning it into confetti.
    delay = (0.015 + 0.125 * radial +
             0.012 * (0.5 + 0.5 * np.sin(angle * 3.0))).astype(np.float32)
    arrival = (0.70 + 0.10 * radial).astype(np.float32)

    # Keep radii large enough to remain circular after H.264/YUV420 delivery.
    phase = (target[:, 0] * 0.018 + target[:, 1] * 0.023).astype(np.float32)
    dot_radius = (step * (0.34 + 0.035 * (0.5 + 0.5 * np.sin(phase)))).astype(np.float32)
    initial_radius = float(min(width, height) * 0.082)
    return (target, source, perpendicular, delay, arrival,
            dot_radius, phase, initial_radius, float(step))


def _smootherstep(value):
    """Quintic ease with zero velocity and acceleration at both endpoints."""
    value = np.clip(value, 0.0, 1.0)
    return value * value * value * (value * (value * 6.0 - 15.0) + 10.0)


def _round_dot_layer(width, height, positions, radii, color):
    """Draw truly round points at 2x resolution, then downsample cleanly."""
    scale = 2
    layer = np.full((height * scale, width * scale, 3), 255, dtype=np.uint8)
    for point, radius in zip(positions, radii):
        if radius < 0.35:
            continue
        x = int(round(float(point[0]) * scale))
        y = int(round(float(point[1]) * scale))
        r = max(1, int(round(float(radius) * scale)))
        cv2.circle(layer, (x, y), r, color, -1, cv2.LINE_AA)
    return cv2.resize(layer, (width, height), interpolation=cv2.INTER_AREA)


def render_argus_outro(width, height, progress):
    """Morph the single dot into a large, permanently dotted ARGUS lockup.

    Motion intentionally follows the film's existing pointillist language:
    dots remain in a coherent matrix, the shape grows outward from the center,
    and dot size changes with the morph. There is no random particle spray and
    no solid-text stage.
    """
    p = float(np.clip(progress, 0.0, 1.0))
    (target, source, perpendicular, delay, arrival,
     dot_radius, phase, initial_radius, step) = _particle_plan(width, height)

    color = tuple(int(channel) for channel in ARGUS_BLUE_BGR)
    local = (p - delay) / np.maximum(0.001, arrival - delay)
    clipped = np.clip(local, 0.0, 1.0)
    eased = _smootherstep(clipped)

    # Preserve the geometry while it expands. A sub-dot-width transverse ripple
    # gives the same living/morphing feel as earlier transitions without making
    # individual points look like independent flying particles.
    position = source + (target - source) * eased[:, None]
    travel = np.sin(np.pi * clipped)
    ripple = (np.sin(phase + p * np.pi * 3.0) * step * 0.42 * travel)
    position = position + perpendicular * ripple[:, None]

    # Dots grow as they emerge, another recurring behavior in the film. Once
    # settled they become stable circles and remain circles through the last frame.
    appear = _smootherstep((p - np.maximum(0.0, delay - 0.035)) / 0.095)
    grow = 0.46 + 0.54 * eased
    pulse = 1.0 + 0.10 * np.sin(np.pi * clipped) * np.sin(phase + p * np.pi * 2.0)
    radii = dot_radius * appear * grow * pulse
    frame = _round_dot_layer(width, height, position, radii, color)

    # The original single blue dot contracts and dissolves directly into that
    # structured field. It is also supersampled so the handoff stays perfectly round.
    circle_ease = float(_smootherstep(p / 0.155))
    circle_alpha = 1.0 - circle_ease
    if circle_alpha > 0.001:
        circle_radius = initial_radius * (1.0 - 0.17 * circle_ease)
        circle = _round_dot_layer(
            width, height,
            np.array([[width / 2, height / 2]], dtype=np.float32),
            np.array([circle_radius], dtype=np.float32), color,
        )
        frame = cv2.addWeighted(circle, circle_alpha, frame,
                                1.0 - circle_alpha, 0.0)

    return frame
'''
          b = b[:start] + replacement + b[end:]
          brand.write_text(b)
          PY
          python -m unittest discover -s tests -p "test_argus_brand.py"
          python scripts/render_argus_direct.py

      - name: Verify Apple-compatible delivery codec
        run: |
          python - <<'PY'
          import json
          import subprocess

          path = "renders/argus-engineer-intelligence-age.mp4"
          raw = subprocess.check_output([
              "ffprobe", "-v", "error", "-select_streams", "v:0",
              "-show_entries", "stream=codec_name,profile,pix_fmt,level,width,height,r_frame_rate",
              "-of", "json", path,
          ])
          stream = json.loads(raw)["streams"][0]
          print(json.dumps(stream, indent=2))
          assert stream["codec_name"] == "h264"
          assert stream["profile"] == "High"
          assert stream["pix_fmt"] == "yuv420p"
          assert stream["level"] == 41
          assert stream["width"] == 1920 and stream["height"] == 1080
          assert stream["r_frame_rate"] == "24/1"
          PY

      - name: Verify final dots stay circular
        run: |
          python - <<'PY'
          import cv2
          import numpy as np

          path = "renders/argus-engineer-intelligence-age.mp4"
          cap = cv2.VideoCapture(path)
          count = round(cap.get(cv2.CAP_PROP_FRAME_COUNT))
          cap.set(cv2.CAP_PROP_POS_FRAMES, count - 1)
          ok, frame = cap.read()
          cap.release()
          assert ok

          hsv = cv2.cvtColor(frame, cv2.COLOR_BGR2HSV)
          h, s, v = cv2.split(hsv)
          mask = (((h >= 100) & (h <= 125) & (s >= 100) & (v >= 120))
                  .astype(np.uint8))
          contours, _ = cv2.findContours(mask, cv2.RETR_EXTERNAL,
                                         cv2.CHAIN_APPROX_SIMPLE)
          circularities = []
          for contour in contours:
              area = cv2.contourArea(contour)
              perimeter = cv2.arcLength(contour, True)
              if 12 <= area <= 180 and perimeter > 0:
                  circularities.append(4.0 * np.pi * area / (perimeter * perimeter))
          assert len(circularities) > 100, len(circularities)
          median = float(np.median(circularities))
          p10 = float(np.percentile(circularities, 10))
          print({"round_dot_components": len(circularities),
                 "median_circularity": median, "p10_circularity": p10})
          assert median >= 0.72, median
          assert p10 >= 0.60, p10
          PY

      - name: Show QA summary
        if: always()
        run: |
          if [ -f reports/argus-direct/qa.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          q = json.loads(Path('reports/argus-direct/qa.json').read_text())
          q.pop('per_frame', None)
          print(json.dumps(q, indent=2))
          PY
          fi

      - name: Upload finished video and QA package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: argus-engineer-final-video
          path: |
            renders/argus-engineer-intelligence-age.mp4
            reports/argus-direct/qa.json
            reports/argus-direct/*contact-sheet.jpg
            reports/argus-direct/worst-frame-neighborhood.jpg
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
