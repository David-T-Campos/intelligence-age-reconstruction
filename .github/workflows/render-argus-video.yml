name: Render ARGUS Engineer video

on:
  push:
    branches: [main]
    paths:
      - "src/argus_brand.py"
      - "scripts/render_argus_direct.py"
      - ".github/workflows/render-argus-video.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt yt-dlp
          ffmpeg -version | head -n 1

      - name: Download public reference film
        run: |
          mkdir -p reference
          python -m yt_dlp \
            "https://vimeo.com/1055260932/1225af8c69" \
            -f "bv*[height<=1080]+ba/b[height<=1080]" \
            --merge-output-format mp4 \
            --remux-video mp4 \
            -o "reference/original-60s.%(ext)s"
          python - <<'PY'
          from pathlib import Path
          files = list(Path('reference').glob('original-60s.*'))
          if not files:
              raise SystemExit('Reference download produced no file')
          src = next((p for p in files if p.suffix.lower() == '.mp4'), files[0])
          dst = Path('reference/original-60s.mp4')
          if src != dst:
              src.replace(dst)
          print(dst, dst.stat().st_size)
          PY

      - name: Render and validate every frame
        run: |
          python scripts/render_argus_direct.py

      - name: Show QA summary
        if: always()
        run: |
          if [ -f reports/argus-direct/qa.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          q = json.loads(Path('reports/argus-direct/qa.json').read_text())
          q.pop('per_frame', None)
          print(json.dumps(q, indent=2))
          PY
          fi

      - name: Upload finished video and QA package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: argus-engineer-final-video
          path: |
            renders/argus-engineer-intelligence-age.mp4
            reports/argus-direct/qa.json
            reports/argus-direct/*contact-sheet.jpg
            reports/argus-direct/worst-frame-neighborhood.jpg
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
