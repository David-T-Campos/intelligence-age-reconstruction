name: Render ARGUS Engineer video

on:
  push:
    branches: [main]
    paths:
      - "src/argus_brand.py"
      - "scripts/render_argus_direct.py"
      - ".github/workflows/render-argus-video.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "yt-dlp[default,curl-cffi]"
          ffmpeg -version | head -n 1
          python -m yt_dlp --version

      - name: Download exact public reference film
        shell: bash
        run: |
          set -u
          mkdir -p reference/download
          rm -f reference/original-60s.mp4

          validate_candidate() {
            candidate="$1"
            [ -f "$candidate" ] || return 1
            width="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$candidate")"
            height="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$candidate")"
            fps="$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate -of csv=p=0 "$candidate")"
            duration="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$candidate")"
            echo "Candidate metadata: ${width}x${height}, fps=${fps}, duration=${duration}"
            python - "$width" "$height" "$fps" "$duration" <<'PY'
          import sys
          w, h = int(sys.argv[1]), int(sys.argv[2])
          num, den = map(float, sys.argv[3].split('/'))
          fps = num / den
          duration = float(sys.argv[4])
          ok = w == 1920 and h == 1080 and 23.90 <= fps <= 24.10 and 59.0 <= duration <= 61.5
          raise SystemExit(0 if ok else 1)
          PY
          }

          accepted=0
          hls="https://player.vimeo.com/external/1128117661.m3u8?s=800251362650a93a1103fae9b5d121fb8750e170&logging=false"
          echo "Trying direct public HLS reference"
          rm -rf reference/download/*
          if ffmpeg -hide_banner -loglevel warning -y \
              -user_agent "Mozilla/5.0" -i "$hls" \
              -map 0:v:0 -map 0:a:0? -c copy -movflags +faststart \
              reference/download/candidate.mp4; then
            if validate_candidate reference/download/candidate.mp4; then
              mv reference/download/candidate.mp4 reference/original-60s.mp4
              accepted=1
              echo "Accepted direct HLS reference"
            fi
          fi

          if [ "$accepted" -ne 1 ]; then
            sources=(
              "https://lbbonline.com/work/128338"
              "https://www.youtube.com/watch?v=kIhb5pEo_j0"
              "https://www.youtube.com/watch?v=N9NeQi2pE7U"
              "https://www.youtube.com/watch?v=Z0rZqS_hE3I"
              "https://vimeo.com/1055260932/1225af8c69"
            )
            for url in "${sources[@]}"; do
              echo "Trying reference source: $url"
              rm -rf reference/download/*
              if python -m yt_dlp \
                  "$url" \
                  -f "bv*[height<=1080]+ba/b[height<=1080]" \
                  --extractor-args "generic:impersonate" \
                  --extractor-args "youtube:player_client=web_safari,web,tv" \
                  --merge-output-format mp4 \
                  --remux-video mp4 \
                  -o "reference/download/candidate.%(ext)s"; then
                candidate="$(find reference/download -maxdepth 1 -type f | head -n 1)"
                if [ -n "$candidate" ] && validate_candidate "$candidate"; then
                  mv "$candidate" reference/original-60s.mp4
                  accepted=1
                  echo "Accepted reference source: $url"
                  break
                fi
              fi
            done
          fi

          if [ "$accepted" -ne 1 ]; then
            echo "No candidate matched the required 1920x1080 / 24 fps / ~60 s reference." >&2
            exit 1
          fi

          ffprobe -hide_banner reference/original-60s.mp4

      - name: Render and validate every frame
        run: |
          python scripts/render_argus_direct.py

      - name: Show QA summary
        if: always()
        run: |
          if [ -f reports/argus-direct/qa.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          q = json.loads(Path('reports/argus-direct/qa.json').read_text())
          q.pop('per_frame', None)
          print(json.dumps(q, indent=2))
          PY
          fi

      - name: Upload finished video and QA package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: argus-engineer-final-video
          path: |
            renders/argus-engineer-intelligence-age.mp4
            reports/argus-direct/qa.json
            reports/argus-direct/*contact-sheet.jpg
            reports/argus-direct/worst-frame-neighborhood.jpg
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
